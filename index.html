  out.push({i:j,why:why,km:Math.round(Math.hypot(c[2]-me[2],c[3]-me[3])*KM)})};
 CIRC.forEach(ci=>{if(ci[1].indexOf(me[0])>-1)ci[1].forEach(n=>{if(idx[n])add(idx[n][0],ci[0])})});
 CT.map((c,j)=>[j,Math.hypot(c[2]-me[2],c[3]-me[3])*KM]).filter(a=>a[1]<=300&&!CT[a[0]][4])
  .sort((a,b)=>a[1]-b[1]).forEach(a=>{if(out.length<7)add(a[0],"Nearby")});
 return out.slice(0,7);
}

function xsell(){
 gX.innerHTML="";dots.forEach(e=>e.classList.remove("nb"));
 const old=document.getElementById("xs");if(old)old.remove();
 const box=document.createElement("div");box.id="xs";box.className="xs";
 if(sel<0){
  if(!view){box.innerHTML="<h3>Cross-sell tip</h3><p class='ask'>Customer ne ek place bataya? Us city par click karo. Neeche nearby places milenge jo saath me bech sakte ho: temple, hotel, dharamshala, ek hi trip me.</p>";$("card").appendChild(box)}
  return;
 }
 const me=CT[sel];
 NB.forEach(n=>{dots[n.i].classList.add("nb");const c=CT[n.i],l=document.createElementNS(NS,"line");
  l.setAttribute("x1",me[2]);l.setAttribute("y1",me[3]);l.setAttribute("x2",c[2]);l.setAttribute("y2",c[3]);l.setAttribute("class","xl");gX.appendChild(l)});
 if(!NB.length)return;
 const names=NB.slice(0,2).map(n=>CT[n.i][0]);
 const pitch="Aap "+me[0]+" ja rahe hain. Wahan se "+names.join(" aur ")+" bhi paas hi hai, ek hi trip me cover ho jayega. Hotel ya dharamshala bhi saath me book kar dein?";
 let h="<h3>Cross-sell: also offer these</h3><ul>";
 NB.forEach((n,k)=>{const c=CT[n.i],hr=Math.max(1,Math.round(n.km*1.3/50));
  h+="<li data-i='"+n.i+"'><span><b>"+c[0]+"</b><br><small>"+SN[c[1]][1]+" · ~"+n.km+" km · ~"+hr+" hr by road</small></span>"+
  "<span><span class='tg"+(k<3?"":" n")+"'>"+n.why+"</span><a href='"+c[5]+"' target='_blank' rel='noopener' title='Open on YatraDham.Org'>↗</a></span></li>"});
 h+="</ul><div class='pitch'></div><p class='ask'>Pehle pucho: kitne din ka plan hai? Kitne log? Kahan se aa rahe hain?</p><button type='button'>Copy pitch line</button>";
 box.innerHTML=h;
 box.querySelector(".pitch").textContent="“"+pitch+"”";
 box.querySelectorAll("li").forEach(li=>li.onclick=()=>pick(+li.dataset.i));
 box.querySelectorAll("li a").forEach(a=>a.onclick=e=>e.stopPropagation());
 const b=box.querySelector("button");
 b.onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(pitch):Promise.reject()).then(()=>{b.textContent="Copied ✓"}).catch(()=>{b.textContent="Copy not allowed"});setTimeout(()=>{b.textContent="Copy pitch line"},1500)};
 $("card").appendChild(box);
}

const _apply=apply,_go=go,_sizes=sizes;
apply=function(){
 NB=sel>=0?nearby(sel):[];
 _apply();
 NB.forEach(n=>{const k=CT[n.i][1];if(sp[k])sp[k].classList.remove("hide")});
 xsell();
};
go=function(t,ms){
 if(sel>=0&&NB.length){
  const p=[CT[sel]].concat(NB.map(n=>CT[n.i])),xs=p.map(a=>a[2]),ys=p.map(a=>a[3]);
  const x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
  let ww=(x1-x0)+70,hh=(y1-y0)+70;
  if(ww/hh<W/H)ww=hh*W/H;else hh=ww*H/W;
  ww=Math.max(ww,110);hh=ww*H/W;
  t=[(x0+x1)/2-ww/2,(y0+y1)/2-hh/2,ww,hh];
 }
 _go(t,ms);
};
sizes=function(){
 _sizes();
 if(sel<0)return;
 const k=vb[2]/W;
 NB.forEach(n=>{const e=dots[n.i];e.style.display="";e.setAttribute("r",6.5*k)});
};
apply();
})();
</script>
